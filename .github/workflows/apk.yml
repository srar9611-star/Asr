name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Make libraries offline
        run: |
          mkdir -p www/libs
          cp node_modules/chart.js/dist/chart.umd.js www/libs/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/libs/
          cp node_modules/sql.js/dist/sql-wasm.js node_modules/sql.js/dist/sql-wasm.wasm www/libs/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js#libs/chart.umd.js#; s#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#libs/xlsx.full.min.js#' www/index.html
          grep -c "libs/" www/index.html
      - run: npx --yes @capacitor/cli@6 add android && npx --yes @capacitor/cli@6 sync android
      - name: Make app icons from logo
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Storage permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />#' $M
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anbar-yar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
